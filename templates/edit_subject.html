
{% extends "base.html" %}

{% block content %}

<h2>Edit Subject</h2>

<p>Update your subject details below.</p>

<hr>

<form method="POST">

    <label>Subject Name:</label>

    <input
        type="text"
        name="name"
        value="{{ subject.name }}"
        required
    >

    <br><br>

    <label>Description:</label>

    <textarea name="description" rows="4">{{ subject.description }}</textarea>

    <br><br>

    <button type="submit">Save Changes</button>

    <a href="{{ url_for('subjects') }}">Cancel</a>

</form>

{% endblock %}
